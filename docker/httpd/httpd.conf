ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ErrorLog /proc/self/fd/2
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

TypesConfig conf/mime.types
DirectoryIndex index.html

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Point d'entrée unique : / sert le front (SPA Vue), /api/<service>/* route vers le
# conteneur backend correspondant. Les 3 services ne sont jamais exposés directement.
ProxyPreserveHost On

ProxyPass        /api/users http://user-service:8083/users
ProxyPassReverse /api/users http://user-service:8083/users

ProxyPass        /api/books http://mediatheque-service:8081/books
ProxyPassReverse /api/books http://mediatheque-service:8081/books

ProxyPass        /api/authors http://mediatheque-service:8081/authors
ProxyPassReverse /api/authors http://mediatheque-service:8081/authors

ProxyPass        /api/events http://event-service:8082/events
ProxyPassReverse /api/events http://event-service:8082/events

# SPA (Vue Router en mode "history") : toute route inconnue du serveur (ex. /books/3,
# rechargée en plein milieu de la nav) doit quand même renvoyer index.html, pas un 404.
FallbackResource /index.html
