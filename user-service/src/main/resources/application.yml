spring:
  application:
    name: user-service
  profiles:
    active: dev
  jpa:
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  grpc:
    server:
      port: 9091

server:
  port: 8083

app:
  cors:
    allowed-origin: http://localhost:5173

logging:
  level:
    com.users: DEBUG
    org.hibernate.SQL: DEBUG
