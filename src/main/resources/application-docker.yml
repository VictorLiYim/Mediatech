spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/${DB_NAME:mediatheque}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER:mediatheque}
    password: ${DB_PASSWORD:mediatheque}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true