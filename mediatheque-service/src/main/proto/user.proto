syntax = "proto3";

package user;

option java_package = "com.mediatheque.grpc";
option java_multiple_files = true;

service UserInfoService {
  rpc getUser(UserRequest) returns (UserReply) {}
}

message UserRequest {
  string userId = 1;
}

message UserReply {
  bool exists = 1;
  string userName = 2;
  bool isAdmin = 3;
}
