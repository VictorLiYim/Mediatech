spring:
  application:
    name: mediatheque-service
  profiles:
    active: dev
  jpa:
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  grpc:
    server:
      port: 9090
    client:
      channels:
        user-service:
          address: localhost:9091

server:
  port: 8081

logging:
  level:
    com.mediatheque: DEBUG
    org.hibernate.SQL: DEBUG
