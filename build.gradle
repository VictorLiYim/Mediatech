// Racine : projet agrégateur uniquement (aucun code, aucun artefact).
// Chaque microservice est un sous-module dans son propre dossier (cf. settings.gradle).
plugins {
	id 'org.springframework.boot' version '4.1.1' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
	id 'com.google.protobuf' version '0.10.0' apply false
}

allprojects {
	group = 'com.mediatheque'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

// Configuration commune à tous les microservices.
subprojects {
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'com.google.protobuf'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}

	// BOM Spring gRPC : fixe des versions cohérentes pour toutes les libs gRPC/Spring gRPC.
	// Étape 5 : net.devh (prévu dans CONTEXT.md) n'est pas compatible Spring Boot 4 → on utilise
	// le projet officiel Spring gRPC à la place (org.springframework.grpc).
	dependencyManagement {
		imports {
			mavenBom 'org.springframework.grpc:spring-grpc-dependencies:1.0.3'
		}
	}

	// Compile les .proto de src/main/proto en code Java (messages + stubs gRPC),
	// généré dans build/generated/source/proto/main/{java,grpc}.
	// Versions de protoc/protoc-gen-grpc-java alignées sur ce que spring-grpc-dependencies:1.0.3 attend
	// (grpc.version=1.77.1, protobuf-java.version=4.33.4) pour éviter tout écart binaire.
	protobuf {
		protoc {
			artifact = 'com.google.protobuf:protoc:4.33.4'
		}
		plugins {
			grpc {
				artifact = 'io.grpc:protoc-gen-grpc-java:1.77.1'
			}
		}
		generateProtoTasks {
			all()*.plugins { grpc {} }
		}
	}

	dependencies {
		// Starters modulaires Spring Boot 4 (spring-boot-starter-web est déprécié au profit de -webmvc).
		implementation 'org.springframework.boot:spring-boot-starter-webmvc'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-validation'

		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

		// H2 pour le profil dev, MariaDB pour le profil docker.
		runtimeOnly 'com.h2database:h2'
		runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

		// Chaque starter de test tire spring-boot-starter-test de façon transitive.
		testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
		testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
		testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
		testCompileOnly 'org.projectlombok:lombok'
		testAnnotationProcessor 'org.projectlombok:lombok'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
